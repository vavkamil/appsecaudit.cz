# https://www.djlint.com/docs/getting-started/ 

name: Lint - HTML

on:
  pull_request:
    paths:
      - 'web/*.html'
      - 'web/**/*.html'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  djlint:
    runs-on: ubuntu-slim
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: '.python-version'

      - name: Install djlint
        run: |
          python -m pip install --upgrade pip
          pip install $(grep '^djlint==' requirements.txt)

      - name: Run djlint
        run: python -m djlint web/**.html web/**/**.html --lint --check --format-css --format-js
