# https://github.com/beautifier/js-beautify

name: Lint - JS

on:
  pull_request:
    paths:
      - 'app/static/js/*.js' ## Doesn't exist

permissions: {}

jobs:
  js-beautify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install js-beautify
        run: |
          python -m pip install --upgrade pip
          pip install $(grep '^jsbeautifier==' requirements.txt)

      - name: Check js-beautify formatting
        run: |
          set -euo pipefail

          echo "🔍 Searching for JS files in app/static/js..."
          # Find all .js files under app/static/js (non-recursive: use -maxdepth 1)
          # For recursive search, remove the -maxdepth line.
          find app/static/js -maxdepth 1 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "▶ Checking formatting for $file"

            tmpfile="$(mktemp)"
            js-beautify -n "$file" > "$tmpfile"

            if ! diff -q "$file" "$tmpfile" > /dev/null; then
              echo "❌ $file is not properly formatted. Please run js-beautify locally."
              # Uncomment these lines if you want to see the full diff:
              # echo "Diff for $file:"
              # diff "$file" "$tmpfile" || true
              rm -f "$tmpfile"
              exit 1
            else
              echo "✅ $file is properly formatted."
            fi

            rm -f "$tmpfile"
          done

          echo "🎉 All JS files are properly formatted."
