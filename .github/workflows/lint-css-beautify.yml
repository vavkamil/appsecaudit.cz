# https://pypi.org/project/cssbeautifier/

name: Lint - CSS

on:
  pull_request:
    paths:
      - 'app/static/css/main.css' ## Doesn't exist

permissions: {}

jobs:
  css-beautify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install css-beautify
        run: |
          python -m pip install --upgrade pip
          pip install $(grep '^cssbeautifier==' requirements.txt)

      - name: Check css-beautify formatting
        run: |
          # Format the file into a temp version
          css-beautify -n app/static/css/main.css > formatted.css

          # Check for differences
          if ! diff -q app/static/css/main.css formatted.css > /dev/null; then
            echo "❌ CSS file is not properly formatted. Please run css-beautify locally."
            diff app/static/css/main.css formatted.css
            exit 1
          else
            echo "✅ CSS file is properly formatted."
          fi
